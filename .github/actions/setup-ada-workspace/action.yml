name: Set up Ada workspace
description: Check out sibling Ada crates and configure the pinned Alire toolchain.
inputs:
  install-gnatdoc:
    description: Install GNATdoc through Alire and add it to PATH.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # Clone the transitive closure of pinned sibling crates from the alire.toml
    # pins themselves, so a change to humanize's dependency graph (e.g. i18n
    # gaining a new transitive pin) is picked up automatically instead of
    # breaking CI until this list is hand-updated.
    - name: Check out sibling crates
      uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
      with:
        root: humanize
    - name: Set up Alire
      uses: alire-project/setup-alire@v6
      with:
        toolchain: gnat_native=15.2.1 gprbuild
    - name: Report selected GNAT
      shell: bash
      # `alr exec` needs a workspace, and this action runs from the checkout
      # root, where the crates sit in subdirectories. Probe from a throwaway
      # crate so the report does not depend on the caller's checkout layout.
      run: |
        alr -n -q init --bin gnat_probe >/dev/null
        cd gnat_probe && alr exec -- gnatls --version
        cd .. && rm -rf gnat_probe
    - name: Install GNATdoc
      if: ${{ inputs.install-gnatdoc == 'true' }}
      shell: bash
      run: |
        alr install gnatdoc
        echo "$HOME/.alire/bin" >> "$GITHUB_PATH"
