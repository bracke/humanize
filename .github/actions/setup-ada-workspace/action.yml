name: Set up Ada workspace
description: Check out sibling Ada crates and configure the pinned Alire toolchain.
inputs:
  install-gnatdoc:
    description: Install GNATdoc through Alire and add it to PATH.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Check out i18n sibling
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository_owner }}/i18n
        path: i18n
    - name: Check out messages sibling
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository_owner }}/messages
        path: messages
    # i18n's tzdb generation pulls in a chain of siblings (awklib -> regexp,
    # tarlib, hostkit, httpclient -> zlib), all of which must be present for the
    # transitive pin paths to resolve. This mirrors i18n's own CI sibling set.
    - name: Check out awklib sibling
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository_owner }}/awklib
        path: awklib
    - name: Check out regexp sibling
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository_owner }}/regexp
        path: regexp
    - name: Check out tarlib sibling
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository_owner }}/tarlib
        path: tarlib
    - name: Check out hostkit sibling
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository_owner }}/hostkit
        path: hostkit
    - name: Check out httpclient sibling
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository_owner }}/httpclient
        path: httpclient
    - name: Check out zlib sibling
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository_owner }}/zlib
        path: zlib
    - name: Check out project_tools sibling
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository_owner }}/project_tools
        path: project_tools
    - name: Check out cryptolib sibling
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository_owner }}/cryptolib
        path: cryptolib
    - name: Set up Alire
      uses: alire-project/setup-alire@v6
      with:
        toolchain: gnat_native=15.2.1 gprbuild
    - name: Report selected GNAT
      shell: bash
      # `alr exec` needs a workspace, and this action runs from the checkout
      # root, where the crates sit in subdirectories. Probe from a throwaway
      # crate so the report does not depend on the caller's checkout layout.
      run: |
        alr -n -q init --bin gnat_probe >/dev/null
        cd gnat_probe && alr exec -- gnatls --version
        cd .. && rm -rf gnat_probe
    - name: Install GNATdoc
      if: ${{ inputs.install-gnatdoc == 'true' }}
      shell: bash
      run: |
        alr install gnatdoc
        echo "$HOME/.alire/bin" >> "$GITHUB_PATH"
