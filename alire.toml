name = "humanize"
description = "Localized humanization of datetimes, durations, bytes, numbers, units"
version = "0.5.0"
website = "https://github.com/bracke/humanize"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
long-description = "humanize is an Ada 2022 Alire library that turns machine values into human-readable, localized text:"

tags = ["i18n", "humanize", "localization"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
messages = ">=0.1.0"

[[depends-on]]
i18n = ">=1.1.0"

[[pins]]
messages = { path = "../messages" }
i18n = { path = "../i18n" }

[[actions]]
type = "test"
command = ["sh", "-c", "cd tests && alr build && ./bin/tests"]

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so roots that share these crates share object files rather
# than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
